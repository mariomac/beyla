name: Update OBI submodule

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: sync-obi-submodule-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Set restrictive permissions at workflow level
permissions: {}

jobs:
  update-obi:
    name: Update OBI submodule and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating commits and pushing branch
      pull-requests: write # Needed for creating PRs
      id-token: write # Required for create-github-app-token
      packages: read # Lets the per-job GITHUB_TOKEN authenticate ghcr.io pulls for higher rate limits
    steps:
      - name: Checkout repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive

      - name: Update submodule
        run: |
          git submodule update --checkout --remote .obi-src

      - name: Get OBI short SHA
        id: obi-sha
        run: |
          echo "sha=$(git -C .obi-src rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Commit submodule update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .obi-src
          git diff --staged --quiet || git commit -m "Update OBI submodule to ${{ steps.obi-sha.outputs.sha }}"

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: "go.mod"
          cache: false

      # `make vendor-obi` pulls a public image from ghcr.io/open-telemetry to
      # run OBI's code-generation Makefile target. Authenticating with the
      # per-job ephemeral GITHUB_TOKEN (scoped to `packages: read` above)
      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Rebuild BPF and vendor OBI
        run: make vendor-obi

      # Defense-in-depth: clear registry credentials from the runner as soon
      # as the upstream-controlled build step is done.
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io || true

      - name: Get GitHub App token
        id: get-github-app-token
        uses: grafana/shared-workflows/actions/create-github-app-token@ae92934a14a48b94494dbc06d74a81d47fe08a40 # create-github-app-token/v0.2.2
        with:
          github_app: grafana-beyla-bot

      - name: Clean up stray action checkouts
        run: rm -rf _shared-workflows-*

      - name: Create/update PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.get-github-app-token.outputs.token }}
          commit-message: "Update OBI submodule to ${{ steps.obi-sha.outputs.sha }}"
          title: "Update OBI submodule to ${{ steps.obi-sha.outputs.sha }}"
          body: |
            Automated update of the OBI (OpenTelemetry eBPF Instrumentation) submodule to the latest commit from grafana/opentelemetry-ebpf-instrumentation main.

            OBI commit: `${{ steps.obi-sha.outputs.sha }}`

            If CI fails due to upstream breaking changes, add the **agent/fix-obi** label to this PR to run the agentic workflow and get suggested fixes.
          base: main
          branch: "update-obi-submodule-${{ github.run_id }}"
          labels: automated-pr
          delete-branch: true
